<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ephesus House Chores</title>
<meta name="description" content="The chore board has moved to a link that works on every phone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #eef2f5; --surface: #fff; --ink: #16242f; --muted: #64798a;
    --line: #d5dfe6; --marker: #0b79c4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0e1920; --surface: #17242d; --ink: #e7eff4; --muted: #8ba2b1;
      --line: #2a3c48; --marker: #55b4ef;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0e1920; --surface: #17242d; --ink: #e7eff4; --muted: #8ba2b1;
    --line: #2a3c48; --marker: #55b4ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.55;
    display: grid; place-items: center; min-height: 100vh;
    padding-block: 40px; padding-inline: 18px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 24px; max-width: 420px; width: 100%;
    box-shadow: 0 1px 2px rgba(22,36,47,.06), 0 14px 32px -16px rgba(22,36,47,.28);
    display: flex; flex-direction: column; gap: 14px;
  }
  .mark { display: flex; align-items: center; gap: 9px; }
  .mark span { width: 9px; height: 9px; border-radius: 50%; background: var(--marker); }
  .mark b {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: 1.0625rem; letter-spacing: -.015em;
  }
  h1 {
    margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: 1.5rem; letter-spacing: -.025em; text-wrap: balance;
  }
  p { margin: 0; color: var(--muted); font-size: .9375rem; }
  a.go {
    display: block; text-align: center; text-decoration: none;
    background: var(--marker); color: #fff; font-weight: 600;
    border-radius: 10px; padding: 13px 16px; margin-top: 4px;
  }
  a.go:hover { filter: brightness(1.08); }
  .url {
    font-size: .75rem; color: var(--muted); word-break: break-all; text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><span></span><b>Ephesus House</b></div>
    <h1>The board moved</h1>
    <p>It lives on its own web address now, so Ivan, Jett and Demitrius all see the
       same board on any phone, with no account to sign into.</p>
    <a class="go" href="https://claudekovalenko.github.io/ephesus-house-oc/">Open the chore board</a>
    <p class="url">claudekovalenko.github.io/ephesus-house-oc</p>
  </div>
</body>
</html>
