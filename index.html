<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ephesus House Chores</title>
<meta http-equiv="refresh" content="0; url=app/">
<link rel="canonical" href="app/">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 32px 18px; background: #eef2f5; color: #16242f;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #0e1920; color: #e7eff4; } }
  a {
    display: inline-block; margin-top: 14px; padding: 13px 20px;
    background: #0b79c4; color: #fff; text-decoration: none;
    border-radius: 10px; font-weight: 600;
  }
  p { margin: 0; opacity: .75; }
</style>
</head>
<body>
  <div style="text-align:center">
    <p>Opening the chore board…</p>
    <a href="app/">Open the chore board</a>
  </div>
</body>
</html>
